# Must match your existing Worker's name so deploys update it (not create a new one).
name = "krogerbuddy"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Optionally lock CORS to your GitHub Pages origin instead of allowing any site:
#   [vars]
#   ALLOW_ORIGIN = "https://josh99smith.github.io"
#
# Credentials are REQUIRED as secrets (no in-code fallbacks):
#   npx wrangler secret put KROGER_CLIENT_SECRET
#   npx wrangler secret put KROGER_CLIENT_ID
